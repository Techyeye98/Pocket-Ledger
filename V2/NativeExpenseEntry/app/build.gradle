plugins { id 'com.android.application' }

android {
    namespace 'com.pocketledger.v2'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pocketledger.v2'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '2.0.0'
    }

    // Release signing credentials are read from gitignored local.properties
    // (written by create-release-keystore.ps1 — never stored in source control).
    //   RELEASE_STORE_FILE=C:/Users/<user>/.android/pocket-ledger-release.jks
    //   RELEASE_STORE_PASSWORD=<random>
    //   RELEASE_KEY_ALIAS=pocketledger
    //   RELEASE_KEY_PASSWORD=<random>
    signingConfigs {
        release {
            File propsFile = rootProject.file('local.properties')
            Properties props = new Properties()
            if (propsFile.exists()) props.load(propsFile.newDataInputStream())
            storeFile file(props.getProperty('RELEASE_STORE_FILE') ?: 'missing-release-keystore')
            storePassword props.getProperty('RELEASE_STORE_PASSWORD', '')
            keyAlias props.getProperty('RELEASE_KEY_ALIAS', 'pocketledger')
            keyPassword props.getProperty('RELEASE_KEY_PASSWORD', '')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // RecyclerView for reorderable category/payment lists
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Room — local database (primary source of truth in V2)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
}
