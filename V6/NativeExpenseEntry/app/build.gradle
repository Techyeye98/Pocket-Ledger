plugins { id 'com.android.application' }

android {
    namespace 'com.pocketledger.v2'
    compileSdk 36

    defaultConfig {
        // Preserve the published package ID so existing installations can update.
        applicationId 'com.pocketledger.v6.preview'
        minSdk 26
        targetSdk 36
        testInstrumentationRunner 'com.pocketledger.v2.ReviewRegressionInstrumentation'
        versionCode 25
        versionName '1.0.0'
    }

    // CI secrets take precedence over gitignored local.properties.
    // The published preview must retain its existing certificate; see docs/RELEASE_SIGNING.md.
    signingConfigs {
        release {
            File propsFile = rootProject.file('local.properties')
            Properties props = new Properties()
            if (propsFile.exists()) propsFile.withInputStream { props.load(it) }
            def secret = { name -> System.getenv(name) ?: props.getProperty(name) }
            storeFile file(secret('RELEASE_STORE_FILE') ?: 'missing-release-keystore')
            storePassword secret('RELEASE_STORE_PASSWORD') ?: ''
            keyAlias secret('RELEASE_KEY_ALIAS') ?: ''
            keyPassword secret('RELEASE_KEY_PASSWORD') ?: ''
            storeType 'PKCS12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Bundled text model: receipt recognition works without a first-use download.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // RecyclerView for reorderable category/payment lists
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Room — local database (primary source of truth in V2)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    
}
